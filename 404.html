<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 - Page Not Found | Manoj Kumar</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<meta name="theme-color" content="#171015">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" crossorigin="anonymous">
<style>
  :root {
    color-scheme: dark;
    --primary: #7a1530;
    --primary-light: #a33350;
    --accent: #c9956b;
    --bg: #171015;
    --heading: #f4eef1;
    --text: #ded4da;
  }
  [data-theme="light"] {
    color-scheme: light;
    --bg: #faf8f6;
    --heading: #1c1218;
    --text: #2a2028;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    text-align: center;
    padding: 20px;
  }
  h1 {
    font-size: 96px;
    font-weight: 800;
    margin: 0;
    color: var(--heading);
    letter-spacing: -2px;
  }
  h1 span { color: var(--primary-light); }
  p { font-size: 18px; line-height: 1.7; margin: 16px 0 36px; }
  .btn-home {
    display: inline-block;
    padding: 14px 36px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    text-decoration: none;
    color: #fff;
    background: linear-gradient(135deg, var(--primary), #5c1025);
    border-radius: 50px;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .btn-home:hover, .btn-home:focus {
    background: linear-gradient(135deg, var(--primary-light), var(--primary));
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(122,21,48,0.35);
  }
</style>
<script>
// Match the visitor's theme from the main site (saved choice > OS preference > dark)
(function () {
  var theme = 'dark';
  try {
    var saved = localStorage.getItem('theme');
    if (saved === 'light' || saved === 'dark') {
      theme = saved;
    } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
      theme = 'light';
    }
  } catch (e) { /* stay on dark default */ }
  if (theme === 'light') {
    document.documentElement.setAttribute('data-theme', 'light');
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) { meta.setAttribute('content', '#faf8f6'); }
  }
})();
</script>
</head>
<body>
<main>
  <h1>4<span>0</span>4</h1>
  <p>Oops! The page you're looking for doesn't exist.<br>It may have been moved, or the link might be broken.</p>
  <a href="/" class="btn-home">Back to Home</a>
</main>
</body>
</html>
